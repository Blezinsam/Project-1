<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do List</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .todo-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .todo-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: #1e293b;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-container input:focus {
            border-color: #6366f1;
        }

        .input-container button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-container button:hover {
            background: #4f46e5;
        }

        .task-stats {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }

        .task-list-container {
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }

        /* Custom Scrollbar */
        .task-list-container::-webkit-scrollbar {
            width: 6px;
        }
        .task-list-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }

        .task-item:hover {
            border-color: #cbd5e1;
            background: #f1f5f9;
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            word-break: break-all;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .task-text {
            font-size: 15px;
            color: #334155;
            transition: color 0.2s, text-decoration 0.2s;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }

        .delete-btn:hover {
            color: #ef4444;
            background: #fee2e2;
        }

        .delete-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="todo-card">
        <div class="todo-header">
            <h1>My Tasks</h1>
        </div>

        <div class="input-container">
            <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
            <button id="addBtn">Add Task</button>
        </div>

        <div class="task-stats" id="taskStats">0 tasks remaining</div>

        <div class="task-list-container" id="taskListContainer">
            <div class="empty-state" id="emptyState">No tasks yet. Add one above!</div>
        </div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskListContainer = document.getElementById('taskListContainer');
        const taskStats = document.getElementById('taskStats');

        let tasks = [];

        function renderTasks() {
            taskListContainer.innerHTML = '';

            if (tasks.length === 0) {
                taskListContainer.innerHTML = '<div class="empty-state">No tasks yet. Add one above!</div>';
                taskStats.textContent = '0 tasks remaining';
                return;
            }

            const remainingCount = tasks.filter(t => !t.completed).length;
            taskStats.textContent = `${remainingCount} task${remainingCount === 1 ? '' : 's'} remaining`;

            tasks.forEach(task => {
                const taskItem = document.createElement('div');
                taskItem.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                taskItem.innerHTML = `
                    <div class="task-content">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} data-id="${task.id}">
                        <span class="task-text">${escapeHTML(task.text)}</span>
                    </div>
                    <button class="delete-btn" data-id="${task.id}" title="Delete task">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        </svg>
                    </button>
                `;

                taskListContainer.appendChild(taskItem);
            });
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;

            const newTask = {
                id: Date.now().toString(),
                text: text,
                completed: false
            };

            tasks.push(newTask);
            taskInput.value = '';
            renderTasks();
            taskInput.focus();
        }

        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            renderTasks();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Event Listeners
        addBtn.addEventListener('click', addTask);

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        taskListContainer.addEventListener('click', (e) => {
            const target = e.target;
            
            // Handle checkbox change
            if (target.classList.contains('task-checkbox')) {
                toggleTask(target.dataset.id);
            }
            
            // Handle delete button click (accounting for SVG clicks)
            const deleteBtn = target.closest('.delete-btn');
            if (deleteBtn) {
                deleteTask(deleteBtn.dataset.id);
            }
        });

        // Initial render
        renderTasks();
    </script>
</body>
</html>
